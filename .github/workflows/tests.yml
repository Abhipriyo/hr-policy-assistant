name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_DENSE: "false"   # keep CI fast and offline; the eval below measures keyword search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Retrieval evaluation
        run: python eval/run_eval.py --no-dense
